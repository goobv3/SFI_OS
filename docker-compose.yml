version: '3.8'

services:
  mariadb:
    image: mariadb:11
    container_name: sf_mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: smartfarm
      MYSQL_USER: farmuser
      MYSQL_PASSWORD: farmsecret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: sf_adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - mariadb

  backend:
    build: ./backend
    container_name: sf_backend
    restart: always
    depends_on:
      mariadb:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      - DB_HOST=mariadb
      - DB_USER=farmuser
      - DB_PASSWORD=farmsecret
      - DB_NAME=smartfarm
      - MQTT_HOST=mosquitto
      - KMA_SERVICE_KEY=3b1b77976ce0ca80247d4cd707834cff148c26d257a9b03826dda6829b75f0ad
      - LAT=37.3390
      - LON=127.4907
      - JWT_SECRET=sf_secret_2026_change_in_production
      - JWT_EXPIRY_HOURS=24
      - SMTP_HOST=
      - SMTP_PORT=
      - SMTP_USER=
      - SMTP_PASS=
      - ALERT_EMAIL=
    command: ./build/smartfarm_server

  # --- 기상 데이터 비동기 수집 태스크 (Weather Fetcher) ---
  weather_fetcher:
    image: python:3.11-slim
    container_name: sf_weather_fetcher
    restart: always
    volumes:
      - ./backend:/app
    working_dir: /app
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      - DB_HOST=mariadb
      - DB_USER=farmuser
      - DB_PASSWORD=farmsecret
      - DB_NAME=smartfarm
      - KMA_HUB_AUTH_KEY=OJfd9VikT06X3fVYpC9OkQ
      - KMA_SERVICE_KEY=3b1b77976ce0ca80247d4cd707834cff148c26d257a9b03826dda6829b75f0ad
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt && python weather_fetcher.py"

  # --- 프론트엔드 서비스 (React + Vite) ---
  frontend:
    build: ./frontend
    container_name: sf_frontend
    restart: always
    depends_on:
      - backend
      - mariadb

  # --- Nginx 리버스 프록시 ---
  nginx:
    build: ./nginx
    container_name: sf_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: sf_mosquitto
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config

volumes:
  db_data:
